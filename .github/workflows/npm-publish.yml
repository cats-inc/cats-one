name: cats-one npm publish

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # npm trusted publishing (OIDC) requires npm 11.5.1+.
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: OIDC diagnostics
        run: |
          echo "id-token env present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-no}"
          npm --version
          npm config get registry

      # No install step yet: runtime dependencies are unpublished and the
      # unit tests only use node built-ins. Once @cats-inc/cats-platform and
      # @cats-inc/cats-runtime are on npm, add a lockfile, npm ci, and a
      # packed-tarball launcher smoke test here.
      - name: Run test gate
        run: npm test

      - name: Publish package
        run: npm publish --tag "${{ inputs.dist_tag }}" --loglevel silly 2>&1 | grep -iE "oidc|audience|token|exchange|http fetch|error" | head -40
