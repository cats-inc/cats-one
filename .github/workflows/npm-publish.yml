name: cats-one npm publish

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
      alias_only:
        description: 'Recover a missing unscoped alias after the canonical version is already published'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # npm trusted publishing (OIDC) requires npm 11.5.1+.
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      # When CI already passed on this exact commit on main, it ran the test gate
      # and more, so the publish does not repeat it. Anything else, such as a
      # release branch or a failed lookup, runs the gate here as before.
      - name: Check whether CI passed on this commit on main
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success&per_page=1" --jq '.total_count' 2>/dev/null || true)
          if [[ "$passed" =~ ^[1-9][0-9]*$ ]]; then tested=true; else tested=false; fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"

      # Workspace tests import developer dependencies. Install the locked
      # registry packages before running the gate on a fresh Actions runner.
      - name: Install dependencies
        if: steps.ci.outputs.tested != 'true'
        run: npm ci --include=dev

      - name: Run test gate
        if: steps.ci.outputs.tested != 'true'
        run: npm test

      - name: Prepare matching unscoped alias
        run: node scripts/prepare-npm-alias.mjs

      - name: Publish canonical package
        if: ${{ !inputs.alias_only }}
        run: npm publish --tag "${{ inputs.dist_tag }}"

      - name: Verify canonical version before alias-only recovery
        if: ${{ inputs.alias_only }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$(npm view "@cats-inc/cats-one@$VERSION" version)" = "$VERSION"

      - name: Publish unscoped alias
        working-directory: .npm/alias
        run: npm publish --tag "${{ inputs.dist_tag }}"
