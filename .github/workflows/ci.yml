name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No npm install: the launcher's runtime dependencies are not yet
      # published, and the unit tests only use node built-ins.
      - name: Test
        run: npm test
