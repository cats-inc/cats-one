name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # A change confined to docs/ skips the workspace matrix and the required
  # test job; branch protection accepts a skipped required job as passing.
  # So does code that already passed: the fingerprint covers every tracked file
  # outside docs/, so a rebase that only brings in docs from main reuses the
  # earlier green run. A pull request's cache is scoped to that request, so a push
  # to main instead reuses its merged pull request's run when that run tested the
  # same tree. Any other path, a manual run or a failed detection runs them.
  # test/docs-boundary.test.js keeps tests, scripts and the launcher from reading docs/.
  changes:
    runs-on: ubuntu-latest
    # Job permissions replace the workflow's: checkout and the merge lookups read
    # contents, the merged pull request and its CI runs.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      tested: ${{ steps.green.outputs.cache-hit == 'true' || steps.merged.outputs.tested == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base="$BEFORE" ;;
            *) base= ;;
          esac
          code=true
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            changed=$(git diff --name-only "$base" HEAD)
            printf 'Changed files:\n%s\n' "$changed"
            if [ -n "$changed" ] && ! grep -qv '^docs/' <<< "$changed"; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
      - name: Fingerprint the code under test
        id: fingerprint
        run: |
          set -euo pipefail
          # Mode, blob and path of every tracked file outside docs/. For a pull
          # request this is the merge result that the tests would exercise.
          fingerprint=$(git ls-tree -r --full-tree HEAD | awk -F '\t' '$2 !~ /^docs\//' | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" | tee -a "$GITHUB_OUTPUT"
      - name: Look for an earlier green run of this exact code
        id: green
        if: steps.paths.outputs.code == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: ci-green-v1-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true
      - name: Reuse the merged pull request's green run
        id: merged
        if: github.event_name == 'push' && steps.paths.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Main requires up-to-date branches, so a squash merge lands the tree
          # its pull request's CI already passed. Reuse that run only when this
          # push adds one commit, the commit is a pull request's merge, the
          # request's final head contains the previous main and has this exact
          # tree, and CI passed on that head. Anything else, or any failed
          # lookup, runs every check.
          tested=false
          sha=$(git rev-parse HEAD)
          if [ -n "$BEFORE" ] && [ "$(git rev-parse --verify --quiet 'HEAD^' || true)" = "$BEFORE" ]; then
            pr=$(gh api "repos/$REPO/commits/$sha/pulls" --jq ".[] | select(.merge_commit_sha == \"$sha\") | \"\(.number) \(.head.sha)\"" 2>/dev/null | head -n 1 || true)
            number=${pr%% *}
            head=${pr##* }
            if [[ "$number" =~ ^[0-9]+$ && "$head" =~ ^[0-9a-f]{40}$ ]] &&
              git fetch --no-tags --quiet origin "refs/pull/$number/head" &&
              [ "$(git rev-parse FETCH_HEAD)" = "$head" ] &&
              git merge-base --is-ancestor "$BEFORE" "$head" &&
              [ "$(git rev-parse "$head^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ]; then
              passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=1" --jq '.total_count' 2>/dev/null || true)
              if [[ "$passed" =~ ^[1-9][0-9]*$ ]]; then
                tested=true
                echo "Pull request #$number passed CI on $head, which has this exact tree."
              fi
            fi
          fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"

  workspace:
    name: workspace (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.code == 'true' && needs.changes.outputs.tested != 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install developer dependencies
        run: npm ci --include=dev
      - name: Test workspace without sibling checkouts or services
        run: node --test test/workspace-inventory.test.js test/workspace-cli.test.js test/workspace-apply.test.js test/workspace-wrappers.test.js

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.code == 'true' && needs.changes.outputs.tested != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Pack tarball
        run: npm pack

      - name: Tarball resolution smoke test
        run: |
          CONSUMER=$(mktemp -d)
          TARBALL=$(ls "$PWD"/cats-inc-cats-one-*.tgz)
          cd "$CONSUMER"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$TARBALL"
          node -e "
            const { pickPlatformBin, pickRuntimeBin } = require('@cats-inc/cats-one/bin/cli.js');
            const { existsSync } = require('node:fs');
            const checks = [
              ['@cats-inc/cats-platform', pickPlatformBin, 'build/server/index.js'],
              ['@cats-inc/cats-runtime', pickRuntimeBin, 'build/runtime/index.js'],
            ];
            for (const [pkg, picker, expected] of checks) {
              const manifestPath = require.resolve(pkg + '/package.json');
              const bin = picker(require(manifestPath)).replace(/^\.\//, '');
              if (bin !== expected) throw new Error(pkg + ' unexpected bin: ' + bin);
              const resolved = manifestPath.replace(/package\.json$/, '') + bin;
              if (!existsSync(resolved)) throw new Error(pkg + ' bin missing on disk: ' + resolved);
              console.log('resolution OK', pkg, '->', bin);
            }
          "
          echo "CONSUMER=$CONSUMER" >> "$GITHUB_ENV"

      - name: Zero-to-running smoke test (non-default runtime port)
        run: |
          cd "$CONSUMER"
          export HOME="$CONSUMER/home"
          mkdir -p "$HOME"
          export CATS_RUNTIME_DIR="$HOME/runtime"
          export CATS_PORT=8391
          export CATS_RUNTIME_BASE_URL=http://127.0.0.1:34110
          node node_modules/@cats-inc/cats-one/bin/cli.js &
          LAUNCHER=$!
          PLATFORM_OK=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8391/health > /dev/null 2>&1; then PLATFORM_OK=1; break; fi
            sleep 1
          done
          RUNTIME_OK=0
          curl -fsS http://127.0.0.1:34110/health > /dev/null 2>&1 && RUNTIME_OK=1
          kill -TERM $LAUNCHER 2>/dev/null || true
          wait $LAUNCHER 2>/dev/null || true
          echo "platform=$PLATFORM_OK runtime=$RUNTIME_OK"
          test "$PLATFORM_OK" = "1" -a "$RUNTIME_OK" = "1"

      - name: Shutdown releases both ports
        run: |
          PLATFORM_DOWN=0
          RUNTIME_DOWN=0
          for i in $(seq 1 15); do
            PLATFORM_DOWN=1; RUNTIME_DOWN=1
            curl -fsS http://127.0.0.1:8391/health > /dev/null 2>&1 && PLATFORM_DOWN=0
            curl -fsS http://127.0.0.1:34110/health > /dev/null 2>&1 && RUNTIME_DOWN=0
            if [ "$PLATFORM_DOWN" = "1" ] && [ "$RUNTIME_DOWN" = "1" ]; then break; fi
            sleep 1
          done
          echo "platform_down=$PLATFORM_DOWN runtime_down=$RUNTIME_DOWN"
          test "$PLATFORM_DOWN" = "1" -a "$RUNTIME_DOWN" = "1"

  # Saved only after the whole matrix and the test job passed on this exact code.
  record-tested:
    needs: [changes, workspace, test]
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.tested != 'true' && needs.workspace.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record this code as tested
        env:
          FINGERPRINT: ${{ needs.changes.outputs.fingerprint }}
        run: |
          mkdir -p .ci-green
          echo "$FINGERPRINT $GITHUB_RUN_ID" > .ci-green/marker
      - uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ci-green-v1-${{ needs.changes.outputs.fingerprint }}
